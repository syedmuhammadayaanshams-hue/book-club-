
<!DOCTYPE html>
<html>
<head>
    <title>Greatest Number</title>
</head>
<body>

    <h2>Find the Greatest Number</h2>

    <input type="number" id="num1" placeholder="Enter num1">
    <input type="number" id="num2" placeholder="Enter num2">
    <input type="number" id="num3" placeholder="Enter num3">

    <button onclick="findGreatest()">Check</button>

    <p id="result"></p>

    <script>
        function findGreatest() {
            var num1 = Number(document.getElementById("num1").value);
            var num2 = Number(document.getElementById("num2").value);
            var num3 = Number(document.getElementById("num3").value);

            if (num1 > num2 && num1 > num3) {
                document.getElementById("result").innerHTML =
                "num1 is the greatest among three";
            }
            else if (num2 > num1 && num2 > num3) {
                document.getElementById("result").innerHTML =
                "num2 is the greatest among three";
            }
            else if (num3 > num1 && num3 > num2) {
                document.getElementById("result").innerHTML =
                "num3 is the greatest among three";
            }
            else {
                document.getElementById("result").innerHTML =
                "Two or more numbers are equal";
            }
        }
    </script>

</body>
</html>
